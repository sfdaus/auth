apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: prakarsa
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: no-middleware-dev-api.prakarsa.id
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 80
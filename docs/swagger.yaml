definitions:
  request.CompleteProfileReq:
    properties:
      birth_date:
        type: string
      gender:
        type: string
      institution_id:
        type: string
    type: object
  request.SignInReq:
    properties:
      email:
        type: string
      password:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  request.SignUpReq:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
  termsOfService: http://swagger.io/terms/
  title: Auth API
  version: 1.0.4
paths:
  /api/v1/auth/complete-profile:
    post:
      consumes:
      - application/json
      description: CompleteProfile
      parameters:
      - description: User ID from Gateway
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: CompleteProfile user
        in: body
        name: completeprofile
        required: true
        schema:
          $ref: '#/definitions/request.CompleteProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: CompleteProfile
      tags:
      - Auth
  /api/v1/auth/signin:
    post:
      consumes:
      - application/json
      description: SignIn
      parameters:
      - description: SignIn user
        in: body
        name: signin
        required: true
        schema:
          $ref: '#/definitions/request.SignInReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: SignIn
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: SignUp
      parameters:
      - description: SignUp user
        in: body
        name: signup
        required: true
        schema:
          $ref: '#/definitions/request.SignUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: SignUp
      tags:
      - Auth
securityDefinitions:
  JwtToken:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

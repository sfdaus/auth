name: Deploy Auth via Helm

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      stage:
        description: "Choose stage to run"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
      image_tag:
        description: "Image tag to redeploy (for stage=redeploy)"
        required: false
      rollback:
        description: "Enable automatic rollback on failure"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.stage == 'deploy' }}
    runs-on: ubuntu-latest

    env:
      NAMESPACE: prakarsa
      RELEASE: auth
      CHART_PATH: ./helm
      IMAGE_REPO: ghcr.io/sfdaus/auth
      IMAGE: ghcr.io/sfdaus/auth:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sfdaus/auth:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create/Update GHCR imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Recreate Secret from server file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=no -i key.pem ${SSH_USER}@${SSH_HOST}"

          # pastikan file env ada di server (format KEY=VALUE, meski namanya .yaml)
          $SSH 'test -f /home/prakarsa/secrets/auth-env.yaml'

          # buat Secret YAML di SERVER, lalu apply ke cluster dari SERVER
          $SSH 'kubectl -n '"$NAMESPACE"' delete secret auth-env --ignore-not-found'
          $SSH 'kubectl -n '"$NAMESPACE"' create secret generic auth-env \
                --from-env-file=/home/prakarsa/secrets/auth-env.yaml \
                --dry-run=client -o yaml | kubectl apply -f -'

          echo "auth-env secret recreated from /home/prakarsa/secrets/auth-env.yaml"

      - name: Deploy via Helm
        run: |
          kubectl cluster-info

          helm upgrade --install $RELEASE $CHART_PATH \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag=${{ github.sha }} \
            --set secretName="auth-env" \
            --wait \
            --timeout=300s \
            --history-max 5

      - name: Verify Rollout
        run: |
          kubectl -n $NAMESPACE rollout status deploy/${RELEASE}
          kubectl -n $NAMESPACE get pods,svc,ingress -l app.kubernetes.io/name=${RELEASE} -o wide

          echo "Deployment completed with SHA: ${{ github.sha }}"

      - name: Rollback on failure
        if: failure() && (github.event_name == 'push' || github.event.inputs.rollback == 'true')
        run: |
          echo "Deployment failed, rolling back Helm release..."
          helm rollback $RELEASE -n $NAMESPACE
          kubectl rollout status deployment/${RELEASE} -n $NAMESPACE --timeout=300s

  redeploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'redeploy' }}
    runs-on: ubuntu-latest

    env:
      NAMESPACE: prakarsa
      RELEASE: auth
      CHART_PATH: ./helm
      IMAGE_REPO: ghcr.io/sfdaus/auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image_tag input
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            echo "ERROR: image_tag is required for redeploy stage."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create/Update GHCR imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Recreate Secret from server file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=no -i key.pem ${SSH_USER}@${SSH_HOST}"

          $SSH 'test -f /home/prakarsa/secrets/auth-env.yaml'

          $SSH 'kubectl -n '"$NAMESPACE"' delete secret auth-env --ignore-not-found'
          $SSH 'kubectl -n '"$NAMESPACE"' create secret generic auth-env \
                --from-env-file=/home/prakarsa/secrets/auth-env.yaml \
                --dry-run=client -o yaml | kubectl apply -f -'

          echo "auth-env secret recreated from /home/prakarsa/secrets/auth-env.yaml"

      - name: Redeploy via Helm (use existing image)
        run: |
          kubectl cluster-info

          helm upgrade --install $RELEASE $CHART_PATH \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --set secretName="auth-env" \
            --wait \
            --timeout=300s \
            --history-max 5

      - name: Verify Rollout
        run: |
          kubectl -n $NAMESPACE rollout status deploy/${RELEASE}
          kubectl -n $NAMESPACE get pods,svc,ingress -l app.kubernetes.io/name=${RELEASE} -o wide

          echo "Redeploy completed with tag: ${{ github.event.inputs.image_tag }}"

      - name: Rollback on failure
        if: failure() && github.event.inputs.rollback == 'true'
        run: |
          echo "Redeploy failed, rolling back Helm release..."
          helm rollback $RELEASE -n $NAMESPACE
          kubectl rollout status deployment/${RELEASE} -n $NAMESPACE --timeout=300s
